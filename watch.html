<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><title>YouTube</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body class="bg-white sidebar-closed"> <main class="max-w-[1280px] mx-auto p-4 lg:p-10">
        <div class="aspect-video bg-black rounded-xl overflow-hidden">
            <video id="player" controls autoplay class="w-full h-full"></video>
        </div>
        <h1 id="title" class="text-xl font-bold mt-4"></h1>
        <div class="flex items-center gap-4 mt-4 border-b pb-4">
            <div class="w-10 h-10 rounded-full bg-gray-200"></div>
            <div>
                <p id="author" class="font-bold"></p>
                <p id="stats" class="text-xs text-gray-500"></p>
            </div>
            <button class="ml-auto bg-black text-white px-4 py-2 rounded-full text-sm font-medium">チャンネル登録</button>
        </div>
        <div id="desc" class="mt-4 bg-gray-100 p-4 rounded-xl text-sm whitespace-pre-wrap"></div>
    </main>
    <script>
        async function load() {
            const v = new URLSearchParams(location.search).get('v');
            const { apiUrl } = await fetch('./api.json').then(r => r.json());
            const data = await fetch(`${apiUrl}/watch/${v}`).then(r => r.json());
            document.getElementById('player').src = data.streamUrl;
            document.getElementById('title').innerText = data.title;
            document.getElementById('author').innerText = data.author;
            document.getElementById('stats').innerText = `${data.views} 回視聴 • ${data.published}`;
            document.getElementById('desc').innerText = data.description;
        }
        load();
    </script>
</body>
</html>
