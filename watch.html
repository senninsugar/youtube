<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Lite Pro - Modern UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { background-color: #ffffff; color: #0f0f0f; font-family: "Roboto", Arial, sans-serif; overflow-x: hidden; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        
        /* 動画プレイヤー */
        .video-container { aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; position: relative; }
        
        /* ツールパネル (スライドイン) */
        #tool-panel {
            position: fixed; top: 0; right: -320px; width: 300px; height: 100%;
            background: #ffffff; box-shadow: -4px 0 15px rgba(0,0,0,0.1);
            z-index: 2000; transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
        }
        #tool-panel.open { right: 0; }
        .panel-content { padding: 20px; overflow-y: auto; flex: 1; }
        
        /* サブメニューの切り替えアニメーション */
        .menu-page { display: none; }
        .menu-page.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }

        /* オーバーレイ */
        #overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            z-index: 1500; opacity: 0; visibility: hidden; transition: 0.3s;
        }
        #overlay.active { opacity: 1; visibility: visible; }

        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-white">

    <nav class="flex items-center justify-between px-4 h-14 sticky top-0 bg-white z-50 border-b">
        <div class="flex items-center gap-4">
            <button onclick="location.href='index.html'" class="p-2 hover:bg-gray-100 rounded-full">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <img src="https://freelogopng.com/images/all_img/1656505113new-youtube-logo.png" alt="YouTube" class="h-5">
        </div>
        <button onclick="togglePanel(true)" class="flex items-center gap-2 bg-gray-100 px-4 py-1.5 rounded-full hover:bg-gray-200 transition text-sm font-medium">
            <span class="material-symbols-outlined text-[20px]">tune</span>
            ツール
        </button>
    </nav>

    <div id="tool-panel">
        <div class="p-4 border-b flex justify-between items-center">
            <h2 class="font-bold text-lg">設定・ツール</h2>
            <button onclick="togglePanel(false)" class="p-1 hover:bg-gray-100 rounded-full">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        
        <div class="panel-content">
            <div id="menu-main" class="menu-page active">
                <div class="flex flex-col gap-1">
                    <button onclick="openSubMenu('quality')" class="flex items-center justify-between p-3 hover:bg-gray-50 rounded-xl text-left">
                        <div class="flex items-center gap-3"><span class="material-symbols-outlined">high_quality</span>画質変更</div>
                        <span class="material-symbols-outlined">chevron_right</span>
                    </button>
                    <button onclick="window.location.reload()" class="flex items-center p-3 hover:bg-gray-50 rounded-xl text-left gap-3">
                        <span class="material-symbols-outlined">refresh</span>再読み込み
                    </button>
                    <a id="download-btn" href="#" target="_blank" class="flex items-center p-3 hover:bg-gray-50 rounded-xl text-left gap-3">
                        <span class="material-symbols-outlined">download</span>動画をダウンロード
                    </a>
                    <button onclick="openSubMenu('debug')" class="flex items-center justify-between p-3 hover:bg-gray-50 rounded-xl text-left">
                        <div class="flex items-center gap-3"><span class="material-symbols-outlined">terminal</span>デバッグログ</div>
                        <span class="material-symbols-outlined">chevron_right</span>
                    </button>
                </div>
            </div>

            <div id="menu-quality" class="menu-page">
                <button onclick="openSubMenu('main')" class="mb-4 flex items-center gap-2 text-blue-600 font-bold">
                    <span class="material-symbols-outlined">arrow_back</span>戻る
                </button>
                <div class="flex flex-col gap-2">
                    <button class="p-3 bg-gray-100 rounded-lg text-left hover:bg-gray-200">720p (MP4)</button>
                    <button class="p-3 bg-gray-50 rounded-lg text-left text-gray-400 cursor-not-allowed">1080p (Coming Soon)</button>
                </div>
            </div>

            <div id="menu-debug" class="menu-page">
                <button onclick="openSubMenu('main')" class="mb-4 flex items-center gap-2 text-blue-600 font-bold">
                    <span class="material-symbols-outlined">arrow_back</span>戻る
                </button>
                <div id="log-container" class="bg-black text-green-400 p-3 rounded-lg font-mono text-[10px] overflow-auto max-h-[400px]"></div>
            </div>
        </div>
    </div>

    <div id="overlay" onclick="togglePanel(false)"></div>

    <main class="max-w-[1700px] mx-auto flex flex-col lg:flex-row gap-6 p-4 lg:px-14">
        <div class="flex-1">
            <div class="video-container shadow-lg">
                <video id="player" controls autoplay class="w-full h-full"></video>
            </div>

            <h1 id="title" class="text-xl font-bold mt-4 leading-tight">Loading...</h1>
            
            <div class="mt-4 flex items-center justify-between border-b pb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center overflow-hidden">
                        <span id="author-icon-fallback" class="material-symbols-outlined text-gray-400">person</span>
                    </div>
                    <div>
                        <p id="author" class="font-bold text-[16px]"></p>
                        <p class="text-[12px] text-gray-500">チャンネル登録者数 120万人</p>
                    </div>
                </div>
            </div>

            <div class="mt-4 bg-gray-100 p-4 rounded-xl">
                <p id="stats" class="text-sm font-bold mb-1"></p>
                <div id="desc" class="text-sm whitespace-pre-wrap leading-relaxed"></div>
            </div>

            <div class="mt-6">
                <h2 id="comment-count" class="text-lg font-bold mb-4">コメント</h2>
                <div id="comment-list" class="flex flex-col gap-6"></div>
            </div>
        </div>

        <aside class="w-full lg:w-[400px] shrink-0">
            <h2 class="text-sm font-bold mb-4 uppercase tracking-wider text-gray-500">関連動画</h2>
            <div id="related-list" class="flex flex-col gap-4"></div>
        </aside>
    </main>

    <script>
        // パネル制御
        function togglePanel(open) {
            document.getElementById('tool-panel').classList.toggle('open', open);
            document.getElementById('overlay').classList.toggle('active', open);
        }

        function openSubMenu(menuId) {
            document.querySelectorAll('.menu-page').forEach(p => p.classList.remove('active'));
            document.getElementById(`menu-${menuId}`).classList.add('active');
        }

        function writeLog(msg, isError = false) {
            const container = document.getElementById('log-container');
            const p = document.createElement('p');
            p.className = "mb-1";
            if(isError) p.classList.add('text-red-400');
            p.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            container.appendChild(p);
            container.scrollTop = container.scrollHeight;
        }

        async function init() {
            writeLog("Initializing load process...");
            const params = new URLSearchParams(location.search);
            const videoId = params.get('id') || params.get('v');
            
            if (!videoId) {
                writeLog("Error: No Video ID", true);
                return;
            }

            // 再生URLとDLボタン
            const streamUrl = `https://ytdlpinstance-vercel.vercel.app/stream/${videoId}?f=18`;
            document.getElementById('player').src = streamUrl;
            document.getElementById('download-btn').href = streamUrl;

            try {
                writeLog("Loading api.json...");
                const config = await fetch('./api.json').then(r => r.json());
                let base = config.apiUrl.replace(/\/$/, "");
                if (base.endsWith("/api")) base = base.slice(0, -4);

                writeLog("Fetching video metadata...");
                const data = await fetch(`${base}/api/watch?id=${videoId}`).then(r => r.json());

                // UI更新
                document.getElementById('title').innerText = data.title;
                document.getElementById('author').innerText = data.author;
                document.getElementById('stats').innerText = `${data.views || 0} 回視聴 • ${data.published || ''}`;
                document.getElementById('desc').innerText = data.description;

                // 関連動画
                if (data.recommended) {
                    document.getElementById('related-list').innerHTML = data.recommended.map(v => `
                        <div class="flex gap-2 cursor-pointer group" onclick="location.href='watch.html?id=${v.id}'">
                            <div class="w-40 h-24 rounded-lg bg-gray-200 overflow-hidden shrink-0 relative">
                                <img src="${v.thumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition">
                            </div>
                            <div class="flex-1">
                                <h3 class="text-sm font-bold line-clamp-2">${v.title}</h3>
                                <p class="text-[12px] text-gray-500 mt-1">${v.author || ''}</p>
                            </div>
                        </div>
                    `).join('');
                }

                // コメント
                if (data.comments) {
                    document.getElementById('comment-count').innerText = `コメント ${data.commentCount || 0}`;
                    document.getElementById('comment-list').innerHTML = data.comments.map(c => `
                        <div class="flex gap-3">
                            <img src="${c.authorIcon}" class="w-10 h-10 rounded-full shrink-0 bg-gray-100" onerror="this.style.display='none'">
                            <div>
                                <p class="text-[13px] font-bold">${c.author}</p>
                                <p class="text-[14px] mt-1 text-gray-800">${c.text}</p>
                            </div>
                        </div>
                    `).join('');
                }

                writeLog("All systems ready.");

            } catch (err) {
                writeLog(`Fatal: ${err.message}`, true);
            }
        }

        init();
    </script>
</body>
</html>
