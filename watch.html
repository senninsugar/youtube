<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Lite Pro - Debug Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { background-color: #ffffff; color: #0f0f0f; font-family: "Roboto", Arial, sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        .video-container { aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-white">

    <nav class="flex items-center justify-between px-4 h-14 sticky top-0 bg-white z-50 border-b">
        <div class="flex items-center gap-4">
            <button onclick="location.href='index.html'" class="p-2 hover:bg-gray-100 rounded-full">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <div class="flex items-center cursor-pointer">
                <img src="https://freelogopng.com/images/all_img/1656505113new-youtube-logo.png" alt="YouTube" class="h-5">
            </div>
        </div>
    </nav>

    <main class="max-w-[1700px] mx-auto flex flex-col lg:flex-row gap-6 p-4 lg:px-14">
        <div class="flex-1">
            <div class="video-container shadow-lg">
                <video id="player" controls autoplay class="w-full h-full"></video>
            </div>

            <h1 id="title" class="text-xl font-bold mt-4">Loading Data...</h1>
            
            <div id="debug-log" class="hidden mt-4 bg-black text-green-400 p-4 rounded-lg font-mono text-xs overflow-x-auto">
                <p class="text-white font-bold border-b border-gray-700 mb-2 pb-1">INTERNAL DEBUG LOG</p>
                <div id="log-content"></div>
            </div>

            <div class="mt-4 border-b pb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-gray-200 shrink-0 flex items-center justify-center">
                        <span class="material-symbols-outlined text-gray-400">person</span>
                    </div>
                    <div class="flex flex-col">
                        <p id="author" class="font-bold text-[16px]"></p>
                        <p class="text-[12px] text-gray-500">チャンネル登録者数 120万人</p>
                    </div>
                </div>
            </div>

            <div class="mt-4 bg-gray-100 p-3 rounded-xl">
                <p id="stats" class="text-sm font-bold mb-1"></p>
                <div id="desc" class="text-sm whitespace-pre-wrap leading-relaxed">
                    データを取得しています...
                </div>
            </div>

            <div class="mt-6">
                <h2 id="comment-count" class="text-lg font-bold mb-4">コメント</h2>
                <div id="comment-list" class="flex flex-col gap-4"></div>
            </div>
        </div>

        <aside class="w-full lg:w-[400px] shrink-0">
            <h2 class="text-sm font-medium mb-4">関連動画</h2>
            <div id="related-list" class="flex flex-col gap-3"></div>
        </aside>
    </main>

    <script>
        function writeLog(msg, isError = false) {
            const container = document.getElementById('debug-log');
            const content = document.getElementById('log-content');
            container.classList.remove('hidden');
            const p = document.createElement('p');
            p.style.color = isError ? '#ff8888' : '#88ff88';
            p.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            content.appendChild(p);
        }

        async function loadVideo() {
            writeLog("Starting loadVideo process...");
            
            const params = new URLSearchParams(location.search);
            const videoId = params.get('id') || params.get('v');
            
            if (!videoId) {
                writeLog("Error: videoId is missing", true);
                document.getElementById('title').innerText = "動画IDが見つかりません";
                return;
            }

            // 動画再生用URLをセット
            const player = document.getElementById('player');
            player.src = `https://ytdlpinstance-vercel.vercel.app/stream/${videoId}?f=18`;

            try {
                writeLog("Fetching api.json...");
                const configRes = await fetch('./api.json').catch(e => { throw new Error("api.json fetch failed") });
                if (!configRes.ok) throw new Error(`api.json returned ${configRes.status}`);
                
                const { apiUrl } = await configRes.json();
                
                let base = apiUrl.replace(/\/$/, "");
                if (base.endsWith("/api")) {
                    base = base.substring(0, base.length - 4);
                }
                
                writeLog(`Cleaned Base URL: ${base}`);

                const requestUrl = `${base}/api/watch?id=${videoId}`;
                writeLog(`Fetching data from: ${requestUrl}`);

                const res = await fetch(requestUrl).catch(e => { throw new Error("API Network Error") });
                if (!res.ok) throw new Error(`API Error ${res.status}`);

                const data = await res.json();
                writeLog("Data successfully received.");

                // UI反映（IDが存在することを確認しながら代入）
                if(document.getElementById('title')) document.getElementById('title').innerText = data.title || "無題";
                if(document.getElementById('author')) document.getElementById('author').innerText = data.author || '不明なチャンネル';
                if(document.getElementById('stats')) document.getElementById('stats').innerText = `${data.views || '0'} 回視聴 • ${data.published || ''}`;
                if(document.getElementById('desc')) document.getElementById('desc').innerText = data.description || '説明はありません。';

                // 関連動画
                if (data.recommended && Array.isArray(data.recommended)) {
                    document.getElementById('related-list').innerHTML = data.recommended.map(rv => `
                        <div class="flex gap-2 cursor-pointer" onclick="location.href='watch.html?id=${rv.id}'">
                            <div class="w-40 h-[94px] rounded-lg bg-gray-200 overflow-hidden shrink-0">
                                <img src="${rv.thumbnail}" class="w-full h-full object-cover">
                            </div>
                            <div class="flex-1">
                                <h3 class="text-xs font-bold line-clamp-2">${rv.title}</h3>
                            </div>
                        </div>
                    `).join('');
                }

                // コメント
                if (data.comments && Array.isArray(data.comments)) {
                    if(document.getElementById('comment-count')) document.getElementById('comment-count').innerText = `コメント ${data.commentCount || '0'}`;
                    document.getElementById('comment-list').innerHTML = data.comments.map(c => `
                        <div class="flex gap-3">
                            <img src="${c.authorIcon}" class="w-10 h-10 rounded-full shrink-0" onerror="this.src='https://www.gstatic.com/youtube/img/originals/ic_persona_60.png'">
                            <div>
                                <p class="text-xs font-bold">${c.author}</p>
                                <p class="text-sm mt-1">${c.text}</p>
                            </div>
                        </div>
                    `).join('');
                }

                writeLog("UI rendering complete.");

            } catch (err) {
                writeLog(`FATAL ERROR: ${err.message}`, true);
                document.getElementById('title').innerText = "読み込みエラー";
                document.getElementById('desc').innerHTML = `<div class="bg-red-100 p-3 rounded text-red-700 text-xs">${err.message}</div>`;
            }
        }

        loadVideo();
    </script>
</body>
</html>
