<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Lite Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { background-color: #ffffff; color: #0f0f0f; font-family: "Roboto", Arial, sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        
        /* スクロールバー隠し */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #aaa; border-radius: 10px; }
        
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .video-container { aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; }
        
        /* スケルトンアニメーション */
        .skeleton { background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="bg-white">

    <nav class="flex items-center justify-between px-4 h-14 sticky top-0 bg-white z-50">
        <div class="flex items-center gap-4">
            <button onclick="location.href='index.html'" class="p-2 hover:bg-gray-100 rounded-full">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <div class="flex items-center cursor-pointer" onclick="location.href='index.html'">
                <img src="https://freelogopng.com/images/all_img/1656505113new-youtube-logo.png" alt="YouTube" class="h-5">
            </div>
        </div>
        <div class="flex-1 max-w-[600px] mx-4 hidden md:flex">
            <div class="flex w-full border border-gray-300 rounded-full overflow-hidden">
                <input id="search-input" type="text" class="w-full px-4 py-2 outline-none" placeholder="検索">
                <button class="bg-gray-50 px-5 border-l border-gray-300 hover:bg-gray-100">
                    <span class="material-symbols-outlined text-gray-600">search</span>
                </button>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span class="material-symbols-outlined p-2 hover:bg-gray-100 rounded-full cursor-pointer">videocam</span>
            <span class="material-symbols-outlined p-2 hover:bg-gray-100 rounded-full cursor-pointer">notifications</span>
            <div class="w-8 h-8 rounded-full bg-purple-600 text-white flex items-center justify-center text-xs">G</div>
        </div>
    </nav>

    <main class="max-w-[1700px] mx-auto flex flex-col lg:flex-row gap-6 p-4 lg:px-14">
        
        <div class="flex-1">
            <div class="video-container shadow-lg">
                <video id="player" controls autoplay class="w-full h-full"></video>
            </div>

            <h1 id="title" class="text-xl font-bold mt-4 leading-7 line-clamp-2">Loading...</h1>
            
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mt-3 border-b pb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-gray-200 shrink-0 flex items-center justify-center">
                        <span class="material-symbols-outlined text-gray-400">person</span>
                    </div>
                    <div class="flex flex-col">
                        <p id="author" class="font-bold text-[16px]"></p>
                        <p class="text-[12px] text-gray-500">チャンネル登録者数 120万人</p>
                    </div>
                    <button class="ml-2 bg-black text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-gray-800 transition">チャンネル登録</button>
                </div>

                <div class="flex items-center gap-2 overflow-x-auto no-scrollbar">
                    <div class="flex items-center bg-gray-100 rounded-full overflow-hidden">
                        <button class="flex items-center gap-2 px-4 py-2 hover:bg-gray-200 border-r border-gray-300">
                            <span class="material-symbols-outlined text-[20px]">thumb_up</span>
                            <span class="text-sm font-medium">高評価</span>
                        </button>
                        <button class="px-4 py-2 hover:bg-gray-200">
                            <span class="material-symbols-outlined text-[20px]">thumb_down</span>
                        </button>
                    </div>
                    <button class="flex items-center gap-2 bg-gray-100 px-4 py-2 rounded-full hover:bg-gray-200">
                        <span class="material-symbols-outlined text-[20px]">share</span>
                        <span class="text-sm font-medium">共有</span>
                    </button>
                    <button class="flex items-center gap-2 bg-gray-100 px-4 py-2 rounded-full hover:bg-gray-200">
                        <span class="material-symbols-outlined text-[20px]">download</span>
                        <span class="text-sm font-medium">オフライン</span>
                    </button>
                </div>
            </div>

            <div class="mt-4 bg-gray-100 p-3 rounded-xl hover:bg-gray-200 cursor-pointer transition" onclick="this.classList.toggle('line-clamp-none')">
                <p id="stats" class="text-sm font-bold mb-1"></p>
                <div id="desc" class="text-sm whitespace-pre-wrap leading-relaxed line-clamp-3"></div>
                <button class="text-sm font-bold mt-2">もっと見る</button>
            </div>

            <div class="mt-6">
                <h2 id="comment-count" class="text-lg font-bold mb-4">コメント</h2>
                <div id="comment-list" class="flex flex-col gap-4">
                    </div>
            </div>
        </div>

        <aside class="w-full lg:w-[400px] shrink-0">
            <h2 class="text-sm font-medium mb-4">関連動画</h2>
            <div id="related-list" class="flex flex-col gap-3">
                <div class="flex gap-2">
                    <div class="w-40 h-24 rounded-lg skeleton shrink-0"></div>
                    <div class="flex-1 py-1">
                        <div class="h-4 w-full skeleton mb-2 rounded"></div>
                        <div class="h-3 w-2/3 skeleton rounded"></div>
                    </div>
                </div>
            </div>
        </aside>

    </main>

    <script>
        async function loadVideo() {
            const params = new URLSearchParams(location.search);
            const videoId = params.get('id') || params.get('v');
            
            if (!videoId) {
                alert("動画IDが見つかりません。ホームに戻ります。");
                location.href = 'index.html';
                return;
            }

            // 動画再生用URLをセット
            document.getElementById('player').src = `https://ytdlpinstance-vercel.vercel.app/stream/${videoId}?f=18`;

            try {
                // 1. 設定の取得
                const configRes = await fetch('./api.json');
                const { apiUrl } = await configRes.json();
                const base = apiUrl.replace(/\/$/, "");

                // 2. 動画詳細の取得
                const res = await fetch(`${base}/api/watch?id=${videoId}`);
                
                // HTTPステータスが200以外の場合は詳細をスロー
                if (!res.ok) {
                    const errorText = await res.text();
                    throw new Error(`HTTP ${res.status}: ${errorText}`);
                }
                
                const data = await res.json();

                // 3. UIへの反映
                document.getElementById('title').innerText = data.title || "無題の動画";
                document.title = `${data.title || "動画再生"} - YouTube`;
                document.getElementById('author').innerText = data.author || '不明なアーティスト';
                document.getElementById('stats').innerText = `${data.views || '0'} 回視聴 • ${data.published || ''}`;
                document.getElementById('desc').innerText = data.description || '説明はありません。';

                // 4. 関連動画のレンダリング
                if (data.recommended && Array.isArray(data.recommended)) {
                    const relatedHtml = data.recommended.map(rv => `
                        <div class="flex gap-2 cursor-pointer group" onclick="location.href='watch.html?id=${rv.id}'">
                            <div class="w-40 h-[94px] rounded-lg overflow-hidden shrink-0 bg-gray-200">
                                <img src="${rv.thumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition" onerror="this.src='https://i.ytimg.com/vi/${rv.id}/hqdefault.jpg'">
                            </div>
                            <div class="flex-1">
                                <h3 class="text-sm font-bold leading-tight line-clamp-2 group-hover:text-blue-600 transition">${rv.title}</h3>
                                <p class="text-[12px] text-gray-500 mt-1">${rv.author || ''}</p>
                                <p class="text-[12px] text-gray-500">${rv.views || ''}</p>
                            </div>
                        </div>
                    `).join('');
                    document.getElementById('related-list').innerHTML = relatedHtml;
                }

                // 5. コメントのレンダリング
                if (data.comments && Array.isArray(data.comments)) {
                    document.getElementById('comment-count').innerText = `コメント ${data.commentCount || ''}`;
                    const commentHtml = data.comments.map(c => `
                        <div class="flex gap-3">
                            <img src="${c.authorIcon}" class="w-10 h-10 rounded-full shrink-0" onerror="this.src='https://www.gstatic.com/youtube/img/originals/ic_persona_60.png'">
                            <div>
                                <div class="flex items-center gap-2">
                                    <span class="text-xs font-bold">${c.author}</span>
                                    <span class="text-xs text-gray-500">${c.date || ''}</span>
                                </div>
                                <p class="text-sm mt-1">${c.text}</p>
                                <div class="flex items-center gap-4 mt-2 text-gray-500">
                                    <span class="material-symbols-outlined text-[16px]">thumb_up</span>
                                    <span class="text-xs">${c.likes || 0}</span>
                                    <span class="material-symbols-outlined text-[16px]">thumb_down</span>
                                </div>
                            </div>
                        </div>
                    `).join('');
                    document.getElementById('comment-list').innerHTML = commentHtml;
                }

            } catch (err) {
                // エラーログの出力と画面表示
                console.error("Critical Frontend Error:", err);
                document.getElementById('title').innerText = "エラーが発生しました";
                
                // エラーの詳細を説明欄に表示
                document.getElementById('desc').innerHTML = `
                    <div class="bg-red-50 p-4 rounded-lg border border-red-200 text-red-700 font-mono text-xs">
                        <p class="font-bold mb-2">エラー詳細:</p>
                        <p>${err.message}</p>
                        <p class="mt-2 opacity-70">Stack: ${err.stack ? err.stack.split('\n')[0] : 'N/A'}</p>
                        <p class="mt-2 text-gray-500">※バックエンドのURL設定(api.json)や、CORS制限、Vercelのログを確認してください。</p>
                    </div>
                `;
            }
        }

        document.getElementById('search-input')?.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') {
                location.href = `index.html?q=${encodeURIComponent(e.target.value)}`;
            }
        });

        loadVideo();
    </script>
</body>
</html>
