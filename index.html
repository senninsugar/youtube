<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Lite Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: "Roboto", Arial, sans-serif; overflow-x: hidden; background: #fff; color: #0f0f0f; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        
        /* サイドバーのアニメーション */
        #sidebar { width: 240px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(0); }
        .sidebar-closed #sidebar { transform: translateX(-240px); width: 0; opacity: 0; pointer-events: none; }
        .sidebar-closed main { margin-left: 0 !important; }

        .sidebar-item { transition: background 0.2s; border-radius: 10px; }
        .sidebar-item:hover { background-color: #f2f2f2; }
        .sidebar-item.active { background-color: #f2f2f2; font-weight: 500; }

        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* エラーアラートのアニメーション */
        @keyframes slideDown {
            from { transform: translate(-50%, -100%); opacity: 0; }
            to { transform: translate(-50%, 20px); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .error-alert {
            position: fixed; top: 0; left: 50%; z-index: 1000;
            animation: slideDown 0.4s forwards;
        }

        /* フェードインアニメーション */
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 検索バーのフォーカス */
        .search-container:focus-within { border-color: #065fd4; box-shadow: inset 0 1px 2px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="bg-white">

    <div id="alert-container"></div>

    <nav class="flex items-center justify-between px-4 h-14 sticky top-0 bg-white z-50">
        <div class="flex items-center gap-4">
            <button id="menu-btn" class="p-2 hover:bg-gray-100 rounded-full cursor-pointer">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <div class="flex items-center cursor-pointer" onclick="goHome()">
                <img src="https://freelogopng.com/images/all_img/1656505113new-youtube-logo.png" alt="YouTube" class="h-5">
                <span class="text-[10px] text-gray-500 ml-1 self-start">JP</span>
            </div>
        </div>
        
        <div class="flex-1 max-w-[720px] mx-8 flex items-center">
            <div class="search-container flex w-full border border-gray-300 rounded-full overflow-hidden ml-4">
                <input id="search-input" type="text" class="w-full px-4 py-2 outline-none text-[16px]" placeholder="検索">
                <button id="search-btn" class="bg-gray-50 px-5 border-l border-gray-300 hover:bg-gray-100">
                    <span class="material-symbols-outlined text-gray-600">search</span>
                </button>
            </div>
        </div>

        <div class="w-8"></div>
    </nav>

    <div class="flex">
        <aside id="sidebar" class="fixed left-0 top-14 h-[calc(100vh-56px)] p-3 bg-white z-40 overflow-y-auto hidden md:block">
            <div id="nav-home" class="sidebar-item active flex items-center gap-6 p-3 cursor-pointer" onclick="goHome()">
                <span class="material-symbols-outlined">home</span><span class="text-sm">ホーム</span>
            </div>
            <div class="sidebar-item flex items-center gap-6 p-3 rounded-lg cursor-pointer">
                <span class="material-symbols-outlined">bolt</span><span class="text-sm">Shorts</span>
            </div>
            <div class="sidebar-item flex items-center gap-6 p-3 rounded-lg cursor-pointer border-b pb-4 mb-4">
                <span class="material-symbols-outlined">subscriptions</span><span class="text-sm">登録チャンネル</span>
            </div>
            <div class="sidebar-item flex items-center gap-6 p-3 rounded-lg cursor-pointer">
                <span class="material-symbols-outlined">history</span><span class="text-sm">履歴</span>
            </div>
            <div class="sidebar-item flex items-center gap-6 p-3 rounded-lg cursor-pointer">
                <span class="material-symbols-outlined">playlist_play</span><span class="text-sm">プレイリスト</span>
            </div>
        </aside>

        <main class="flex-1 md:ml-[240px] p-6 transition-all duration-300 min-h-screen">
            <h2 id="page-title" class="text-xl font-bold mb-6">トレンド</h2>
            
            <div id="loading" class="flex justify-center py-20 hidden">
                <div class="animate-spin h-10 w-10 border-4 border-red-500 rounded-full border-t-transparent"></div>
            </div>

            <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-x-4 gap-y-10 fade-in">
            </div>
        </main>
    </div>

    <script>
        let config = {};

        // サイドバー制御
        document.getElementById('menu-btn').addEventListener('click', () => {
            document.body.classList.toggle('sidebar-closed');
        });

        // エラーアラート
        function showAlert(message) {
            const container = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = 'error-alert bg-[#212121] text-white px-6 py-3 rounded shadow-2xl flex items-center gap-3 min-w-[300px] border-l-4 border-red-500';
            alert.innerHTML = `
                <span class="material-symbols-outlined text-red-500">error</span>
                <span class="text-sm font-medium flex-1">${message}</span>
                <button onclick="this.parentElement.remove()" class="ml-4 opacity-70 hover:opacity-100">✕</button>
            `;
            container.appendChild(alert);
            setTimeout(() => {
                alert.style.animation = 'fadeOut 0.5s forwards';
                setTimeout(() => alert.remove(), 500);
            }, 5000);
        }

        // 初期化 & トレンド表示
        async function loadTrending() {
            renderLoading(true);
            document.getElementById('page-title').innerText = "トレンド";
            document.getElementById('nav-home').classList.add('active');

            try {
                const res = await fetch(`${config.apiUrl}/trending`);
                if (!res.ok) throw new Error("データの取得に失敗しました");
                const videos = await res.json();
                renderVideos(videos, 'grid');
            } catch (err) {
                showAlert(err.message);
            } finally {
                renderLoading(false);
            }
        }

        // 検索機能
        async function executeSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            renderLoading(true);
            document.getElementById('page-title').innerText = `「${query}」の検索結果`;
            document.getElementById('nav-home').classList.remove('active');

            try {
                const res = await fetch(`${config.apiUrl}/search?q=${encodeURIComponent(query)}`);
                if (!res.ok) throw new Error("検索に失敗しました");
                const videos = await res.json();
                renderVideos(videos, 'list');
            } catch (err) {
                showAlert(err.message);
            } finally {
                renderLoading(false);
            }
        }

        // 動画レンダリング
        function renderVideos(videos, mode) {
            const grid = document.getElementById('video-grid');
            
            if (mode === 'grid') {
                grid.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-x-4 gap-y-10 fade-in";
                grid.innerHTML = videos.map(v => `
                    <div class="cursor-pointer group flex flex-col" onclick="location.href='watch.html?v=${v.id}'">
                        <div class="relative rounded-xl overflow-hidden aspect-video bg-gray-100">
                            <img src="${v.thumbnail}" class="w-full h-full object-cover transition-transform group-hover:scale-105 duration-300">
                        </div>
                        <div class="flex gap-3 mt-3">
                            <div class="w-9 h-9 rounded-full bg-gray-200 shrink-0"></div>
                            <div>
                                <h3 class="text-[15px] font-semibold leading-tight line-clamp-2">${v.title}</h3>
                                <p class="text-[13px] text-gray-600 mt-1 hover:text-[#0f0f0f]">${v.author}</p>
                                <p class="text-[13px] text-gray-600">${v.views} • ${v.published}</p>
                            </div>
                        </div>
                    </div>
                `).join('');
            } else {
                grid.className = "flex flex-col gap-4 max-w-5xl fade-in";
                grid.innerHTML = videos.map(v => `
                    <div class="flex flex-col sm:flex-row gap-4 cursor-pointer group" onclick="location.href='watch.html?v=${v.id}'">
                        <div class="w-full sm:w-[360px] shrink-0 relative rounded-xl overflow-hidden aspect-video bg-gray-100">
                            <img src="${v.thumbnail}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1 py-1">
                            <h3 class="text-lg font-medium leading-tight line-clamp-2">${v.title}</h3>
                            <p class="text-xs text-gray-600 mt-2">${v.views} • ${v.published}</p>
                            <div class="flex items-center gap-2 my-3">
                                <div class="w-6 h-6 rounded-full bg-gray-200"></div>
                                <p class="text-xs text-gray-600 hover:text-black">${v.author}</p>
                            </div>
                            <p class="text-xs text-gray-500 line-clamp-2">${v.description || ''}</p>
                        </div>
                    </div>
                `).join('');
            }
        }

        function renderLoading(show) {
            const loader = document.getElementById('loading');
            const grid = document.getElementById('video-grid');
            if(loader) loader.classList.toggle('hidden', !show);
            if(grid) grid.classList.toggle('hidden', show);
        }

        function goHome() {
            document.getElementById('search-input').value = "";
            loadTrending();
        }

        document.getElementById('search-btn').onclick = executeSearch;
        document.getElementById('search-input').onkeypress = (e) => { if(e.key === 'Enter') executeSearch(); };

        async function init() {
            try {
                const configRes = await fetch('./api.json');
                config = await configRes.json();
                const params = new URLSearchParams(location.search);
                const q = params.get('q');
                if (q) {
                    document.getElementById('search-input').value = q;
                    executeSearch();
                } else {
                    loadTrending();
                }
            } catch (e) {
                showAlert("設定ファイルを読み込めません");
            }
        }

        init();
    </script>
</body>
</html>
